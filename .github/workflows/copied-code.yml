name: Copied code
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  compare:
    name: Copied code matches ibus-ngosen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          set +e
          misc/check-copied-code.sh > report.txt
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat report.txt
      - name: Open an issue
        if: steps.check.outputs.status == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Copied code: ibus-ngosen changed files copied here"
          if [ -z "$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[].number')" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file report.txt
          fi
